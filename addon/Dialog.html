<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, 'Google Sans', 'Segoe UI', sans-serif;
      font-size: 14px;
      color: #202124;
      background: #fff;
    }

    #drop-zone {
      border: 2px dashed #dadce0;
      border-radius: 8px;
      padding: 36px 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color .15s, background .15s;
      user-select: none;
    }
    #drop-zone:hover       { border-color: #1a73e8; }
    #drop-zone.drag-over   { border-color: #1a73e8; background: #e8f0fe; }
    #drop-zone.has-files   { padding: 16px; border-style: solid; border-color: #dadce0; cursor: default; }
    #drop-zone.has-files:hover { border-color: #dadce0; }

    #drop-icon { font-size: 32px; margin-bottom: 8px; }
    #drop-zone.has-files #drop-hint  { display: none; }
    #drop-zone.has-files #drop-label { display: none; }
    #drop-zone.has-files #drop-icon  { display: none; }

    #file-input { display: none; }

    /* ── Thumbnail preview grid (mirrors Slides' own "Import slides" picker) ── */
    #thumb-grid {
      display: none;
      grid-template-columns: repeat(auto-fill, minmax(104px, 1fr));
      gap: 10px;
      text-align: left;
    }
    #thumb-grid.visible { display: grid; }
    .thumb-card {
      border: 1px solid #dadce0;
      border-radius: 8px;
      overflow: hidden;
      background: #fff;
    }
    .thumb-img-wrap {
      height: 78px;
      background:
        linear-gradient(45deg, #f1f3f4 25%, transparent 25%, transparent 75%, #f1f3f4 75%) 0 0/16px 16px,
        linear-gradient(45deg, #f1f3f4 25%, #fff 25%, #fff 75%, #f1f3f4 75%) 8px 8px/16px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
    }
    .thumb-img-wrap img { max-width: 100%; max-height: 100%; }
    .thumb-name {
      padding: 5px 8px;
      font-size: 11px;
      color: #5f6368;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      border-top: 1px solid #f1f3f4;
    }

    #change-link { display: none; margin-top: 12px; font-size: 12px; color: #1a73e8; cursor: pointer; text-decoration: underline; }
    #change-link.visible { display: inline; }

    /* ── Status / progress ── */
    #status {
      min-height: 22px;
      margin-top: 14px;
      font-size: 13px;
      color: #5f6368;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #status.error   { color: #d93025; }

    .spinner {
      flex-shrink: 0;
      width: 14px;
      height: 14px;
      border: 2px solid #e8eaed;
      border-top-color: #1a73e8;
      border-radius: 50%;
      animation: spin .75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Steps indicator ── */
    #steps {
      display: none;
      margin-top: 10px;
      padding: 10px 12px;
      background: #f8f9fa;
      border-radius: 6px;
      font-size: 12px;
      color: #5f6368;
    }
    #steps.visible { display: block; }
    .step { padding: 2px 0; display: flex; align-items: center; gap: 6px; }
    .step-icon { font-size: 10px; width: 14px; text-align: center; }
    .step.done   .step-icon::before { content: '✓'; color: #188038; }
    .step.active .step-icon { display: flex; align-items: center; justify-content: center; }
    .step.active .step-icon::before { content: ''; display: block; width: 10px; height: 10px; border: 1.5px solid #e8eaed; border-top-color: #1a73e8; border-radius: 50%; animation: spin .75s linear infinite; }
    .step.pending .step-icon::before { content: '○'; color: #bdc1c6; }
    .step.active  { color: #202124; font-weight: 500; }
    .step.done    { color: #5f6368; }

    /* ── "Paste to finish" hint card ── */
    #paste-hint {
      display: none;
      margin-top: 14px;
      padding: 18px 20px;
      background: #e6f4ea;
      border: 2px solid #34a853;
      border-radius: 10px;
      align-items: center;
      gap: 14px;
      animation: pulse-border 1.6s ease-in-out infinite;
    }
    #paste-hint.visible { display: flex; }
    #paste-hint .check { font-size: 26px; color: #188038; flex-shrink: 0; }
    #paste-hint .msg { font-size: 15px; font-weight: 500; color: #202124; line-height: 1.45; }
    @keyframes pulse-border {
      0%, 100% { border-color: #34a853; box-shadow: 0 0 0 0 rgba(52,168,83,0.25); }
      50%      { border-color: #188038; box-shadow: 0 0 0 6px rgba(52,168,83,0); }
    }
    kbd {
      display: inline-block;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      background: #fff;
      border: 1px solid #34a853;
      border-bottom-width: 2px;
      border-radius: 4px;
      padding: 2px 8px;
      margin: 0 2px;
    }

    /* ── Actions ── */
    .actions { margin-top: 20px; display: flex; justify-content: flex-end; gap: 8px; }

    button {
      padding: 8px 20px;
      border-radius: 4px;
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
      border: none;
      outline: none;
    }
    #cancel-btn { background: transparent; color: #5f6368; border: 1px solid #dadce0; }
    #cancel-btn:hover:not(:disabled) { background: #f1f3f4; }
    #insert-btn { background: #1a73e8; color: #fff; }
    #insert-btn:hover:not(:disabled) { background: #1765cc; }
    #insert-btn:disabled, #cancel-btn:disabled { opacity: .5; cursor: default; }
  </style>
</head>
<body>

<div id="drop-zone">
  <input type="file" id="file-input" accept=".svg" multiple>
  <div id="drop-icon">⬆</div>
  <div id="drop-label" style="font-weight:500; margin-bottom:4px;">Drop SVG files here</div>
  <div id="drop-hint" style="color:#5f6368; font-size:13px;">or click to browse — multiple files combine onto the current slide</div>
  <div id="thumb-grid"></div>
</div>
<span id="change-link">Choose different files</span>

<!-- Off-screen clipboard-write target. The Slides paste handler reads its
     shapes from a custom clipboard MIME type set here via the legacy
     `copy`-event API (clipboardData.setData), which — unlike the modern
     navigator.clipboard.write()/ClipboardItem API — has no "web " prefix
     restriction on custom types, so it's the only mechanism that can produce
     a payload Slides will actually recognize. -->
<div id="clip-target" contenteditable="true" style="position:absolute; left:-9999px; top:-9999px;">x</div>

<div id="status"></div>

<div id="steps">
  <div class="step pending" id="step-convert"><span class="step-icon"></span>Convert SVG</div>
  <div class="step pending" id="step-copy"><span class="step-icon"></span>Copy to clipboard</div>
</div>

<!-- Paste can't be automated — Chrome blocks programmatic clipboard reads
     outright regardless of user gesture, unlike writes (see copyToClipboard
     below). This is the clearest possible nudge for the one remaining
     manual step. -->
<div id="paste-hint">
  <span class="check">✓</span>
  <span class="msg">Copied! Click your slide, then press <kbd>⌘V</kbd> (Mac) or <kbd>Ctrl</kbd>+<kbd>V</kbd> (Windows) to paste.</span>
</div>

<div class="actions">
  <button id="cancel-btn">Cancel</button>
  <button id="insert-btn" disabled>Convert</button>
</div>

<script>
  var selectedFiles = [];
  var pendingBundle = null;   // {mimeType: string, ...} once converted, until copied
  var stage = 'idle';         // 'idle' -> 'converted' -> 'done'

  var dropZone   = document.getElementById('drop-zone');
  var fileInput  = document.getElementById('file-input');
  var thumbGrid  = document.getElementById('thumb-grid');
  var changeLink = document.getElementById('change-link');
  var statusEl   = document.getElementById('status');
  var stepsEl    = document.getElementById('steps');
  var pasteHint  = document.getElementById('paste-hint');
  var insertBtn  = document.getElementById('insert-btn');
  var cancelBtn  = document.getElementById('cancel-btn');
  var clipTarget = document.getElementById('clip-target');

  // ── Clipboard write ──────────────────────────────────────────────────────
  // Must run inside the transient-activation window of a real click — never
  // called from inside an async success handler, only from a fresh, direct
  // button click (see insertBtn's handler below).

  clipTarget.addEventListener('copy', function(e) {
    e.preventDefault();
    if (!pendingBundle) return;
    Object.keys(pendingBundle).forEach(function(mime) {
      e.clipboardData.setData(mime, pendingBundle[mime]);
    });
  });

  function writeClipBundle(bundle) {
    pendingBundle = bundle;
    clipTarget.focus();
    var range = document.createRange();
    range.selectNodeContents(clipTarget);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    var ok = document.execCommand('copy');
    pendingBundle = null;
    return ok;
  }

  dropZone.addEventListener('click', function(e) {
    if (dropZone.classList.contains('has-files')) return;
    if (e.target === changeLink) return;
    fileInput.click();
  });
  changeLink.addEventListener('click', function(e) {
    e.stopPropagation();
    fileInput.click();
  });
  dropZone.addEventListener('dragover',  function(e) { e.preventDefault(); e.stopPropagation(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', function(e) { e.stopPropagation(); dropZone.classList.remove('drag-over'); });
  dropZone.addEventListener('drop', function(e) {
    e.preventDefault(); e.stopPropagation();
    dropZone.classList.remove('drag-over');
    var svgs = Array.from(e.dataTransfer.files).filter(function(f) { return f.name.toLowerCase().endsWith('.svg'); });
    if (svgs.length) applyFiles(svgs);
  });
  fileInput.addEventListener('change', function() {
    if (fileInput.files.length) applyFiles(Array.from(fileInput.files));
  });

  function applyFiles(files) {
    selectedFiles = files;
    dropZone.classList.add('has-files');
    thumbGrid.classList.add('visible');
    renderThumbnails(files);
    changeLink.classList.add('visible');

    // Changing the file selection invalidates any already-converted bundle.
    pendingBundle = null;
    stage = 'idle';
    insertBtn.textContent = 'Convert';
    insertBtn.disabled = true;
    cancelBtn.textContent = 'Cancel';
    stepsEl.className = '';
    pasteHint.classList.remove('visible');
    setStep('step-convert', 'pending');
    setStep('step-copy', 'pending');
    clearStatus();

    // Conversion itself needs no user gesture (it's just a network call), so
    // start it immediately rather than waiting for a click. The one gesture
    // browsers actually require — a fresh click/keypress — is reserved for
    // the clipboard write in copyToClipboard(), which can't be skipped: it
    // has to happen inside transient user activation, which does not survive
    // this async conversion round-trip (confirmed the hard way earlier).
    convertFiles();
  }

  function renderThumbnails(files) {
    thumbGrid.innerHTML = '';
    files.forEach(function(file) {
      var card = document.createElement('div');
      card.className = 'thumb-card';

      var imgWrap = document.createElement('div');
      imgWrap.className = 'thumb-img-wrap';
      var img = document.createElement('img');
      img.src = URL.createObjectURL(file);
      imgWrap.appendChild(img);

      var name = document.createElement('div');
      name.className = 'thumb-name';
      name.textContent = file.name;
      name.title = file.name;

      card.appendChild(imgWrap);
      card.appendChild(name);
      thumbGrid.appendChild(card);
    });
  }

  function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function clearStatus() { statusEl.innerHTML = ''; statusEl.className = ''; }

  function setStatus(msg, spinning, cls) {
    if (spinning) {
      statusEl.innerHTML = '<div class="spinner"></div><span>' + esc(msg) + '</span>';
    } else {
      statusEl.textContent = msg;
    }
    statusEl.className = cls || '';
  }

  function setStep(id, state) {
    var el = document.getElementById(id);
    el.className = 'step ' + state;
  }

  function setLoading(on) {
    insertBtn.disabled = on;
    cancelBtn.disabled = on;
    stepsEl.className  = on ? 'visible' : '';
  }

  function onError(err) {
    setStatus('✗ ' + err.message, false, 'error');
    setStep('step-convert', 'pending');
    setStep('step-copy', 'pending');
    setLoading(false);
    stage = 'idle';
    insertBtn.textContent = 'Convert';
    insertBtn.focus();
  }

  insertBtn.addEventListener('click', function() {
    if (stage === 'idle') {
      convertFiles();
    } else if (stage === 'converted') {
      copyToClipboard();
    } else {
      google.script.host.close();
    }
  });

  function convertFiles() {
    if (!selectedFiles.length) return;

    setLoading(true);
    stepsEl.className = 'visible';
    setStep('step-convert', 'active');
    setStatus('Reading files…', true);

    // Read all selected SVGs as base64
    var promises = selectedFiles.map(function(file) {
      return new Promise(function(resolve, reject) {
        var reader = new FileReader();
        reader.onload  = function(e) { resolve({name: file.name, data: e.target.result.split(',')[1]}); };
        reader.onerror = function()  { reject(new Error('Could not read ' + file.name)); };
        reader.readAsDataURL(file);
      });
    });

    Promise.all(promises).then(function(payload) {
      setStatus('Converting SVG…', true);

      google.script.run
        .withSuccessHandler(function(clipBundle) {
          setStep('step-convert', 'done');
          pendingBundle = clipBundle;
          stage = 'converted';
          insertBtn.disabled = false;
          cancelBtn.disabled = false;
          insertBtn.textContent = 'Copy shapes to clipboard';
          setStatus('Ready — click below or press Enter to copy.', false);
          // Auto-focus so Enter/Space immediately triggers the copy — that
          // keypress is itself a fresh, genuine user gesture, so it's a
          // legitimate way to make this feel like one action even though a
          // gesture is technically still required for the clipboard write.
          insertBtn.focus();
        })
        .withFailureHandler(onError)
        .fetchClipFromBackend(payload);

    }).catch(onError);
  }

  function copyToClipboard() {
    setStep('step-copy', 'active');
    var bundle = pendingBundle;
    var ok = writeClipBundle(bundle);

    if (!ok) {
      onError(new Error('Clipboard write failed — try clicking the button again.'));
      pendingBundle = bundle;
      stage = 'converted';
      insertBtn.textContent = 'Copy shapes to clipboard';
      insertBtn.disabled = false;
      return;
    }

    setStep('step-copy', 'done');
    clearStatus();
    pasteHint.classList.add('visible');
    stage = 'done';
    // Deliberately NOT auto-closing on a timer: the "click your slide,
    // press ⌘V" instruction is the one step that actually matters, and a
    // brief flash before vanishing risks it being missed entirely. The card
    // stays up (with a pulse animation) until dismissed — either via Done,
    // or by any keypress (see the keydown listener below), since the most
    // likely next keypress is ⌘V itself.
    insertBtn.textContent = 'Done';
    insertBtn.disabled = false;
    insertBtn.focus();
    cancelBtn.textContent = 'Copy again';
    cancelBtn.disabled = false;
  }

  // Once copied, close on the very first keydown of whatever comes next.
  // For a real ⌘V, the Cmd/Meta key's own keydown fires slightly before V's
  // — closing here lets focus shift to the presentation while V is still
  // being held, so V can land as a genuine paste in Slides instead of being
  // swallowed by this dialog.
  document.addEventListener('keydown', function() {
    if (stage === 'done') google.script.host.close();
  });

  cancelBtn.addEventListener('click', function() {
    if (stage === 'done') {
      // Let the user copy again in case the paste didn't land.
      stage = 'converted';
      insertBtn.textContent = 'Copy shapes to clipboard';
      cancelBtn.textContent = 'Cancel';
      pasteHint.classList.remove('visible');
      setStatus('Ready — click below or press Enter to copy.', false);
      setStep('step-copy', 'pending');
      insertBtn.focus();
    } else {
      google.script.host.close();
    }
  });
</script>
</body>
</html>
