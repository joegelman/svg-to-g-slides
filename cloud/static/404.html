<style>
html{scroll-behavior:smooth}
/* Layout: one centred column, 2010-Apple cadence — headline, one product shot, hairline rules between quiet sections. */
:root{
  --bg:#ffffff; --fg:#1c1e22; --mute:#6b6f76; --rule:#e6e8eb; --tint:#fffbea;
  --yellow:#FFC700; --blue:#0066FF; --blue-ink:#0a57d0; --check:#4CCB3E;
  --display:"Overpass","Helvetica Neue",Arial,sans-serif; --body:Verdana,"DejaVu Sans",Geneva,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#141518; --fg:#f1f2f4; --mute:#a4a8b0; --rule:#2a2d33; --tint:#1e1c14; --blue:#4d8dff; --blue-ink:#2f74e8; color-scheme:dark } }
:root[data-theme="dark"]{ --bg:#141518; --fg:#f1f2f4; --mute:#a4a8b0; --rule:#2a2d33; --tint:#1e1c14; --blue:#4d8dff; --blue-ink:#2f74e8; color-scheme:dark }

*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:-.015em;text-wrap:balance;margin:0}
h1{font-size:clamp(38px,6.2vw,66px);line-height:1.05}
h2{font-size:clamp(28px,3.6vw,40px);line-height:1.12}
h3{font-size:22px;line-height:1.2}
p{margin:0}
.lede{font-size:clamp(17px,1.6vw,20px);line-height:1.5;color:var(--mute);max-width:46em}
a{color:inherit}
.btn{display:inline-flex;align-items:center;gap:10px;height:52px;padding:0 24px;border-radius:26px;font:600 17px var(--display);text-decoration:none;white-space:nowrap}
.btn-primary{background:var(--blue);color:#fff;box-shadow:0 1px 2px rgba(0,0,0,.18)} .btn-primary:hover{background:var(--blue-ink)}
.btn-primary img{width:22px;height:22px}
.btn-ghost{color:var(--fg);border:1.5px solid var(--rule)} .btn-ghost:hover{border-color:var(--mute)}
.btn:focus-visible,a:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
.rule{border:0;border-top:1px solid var(--rule);margin:0}

/* nav */
.nav{display:flex;align-items:center;justify-content:space-between;padding-block:22px}
.brand{display:flex;align-items:center;gap:12px;font:600 22px var(--display);text-decoration:none}
.brand img{width:48px;height:48px}
.nav .btn{height:40px;padding:0 18px;font-size:15px}

/* hero */
.hero{text-align:center;padding-block:56px 0}
.hero h1{max-width:14em;margin:0 auto 20px}
.hero .lede{margin:0 auto 30px}
.ctas{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:18px}
.free{font-size:15px;color:var(--fg);margin:0 0 12px}
.alt{font-size:14px;color:var(--mute);margin:-6px 0 14px} .alt a{color:var(--mute)}
.proof{font-size:14px;color:var(--mute);margin-bottom:44px;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.proof .stars{color:var(--yellow);letter-spacing:1px;font-size:16px}
.proof .badge{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);border-radius:999px;padding:3px 10px 3px 6px;color:var(--fg);font-size:13px}
.proof .badge img{width:22px;height:22px}
.proof b{color:var(--fg);font-weight:600}
.shot{width:100%;max-width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#F9FAFD;box-shadow:0 1px 2px rgba(0,0,0,.06),0 24px 60px rgba(20,30,60,.16);position:relative}
.shot::before{content:"";position:absolute;inset:-60px;background:radial-gradient(60% 50% at 50% 100%,rgba(255,199,0,.22),transparent 70%);z-index:0;pointer-events:none}
.shot .lot{position:absolute;inset:0;z-index:1}

/* problem */
.problem{padding-block:64px;display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
.problem p{font-size:clamp(17px,1.5vw,19px);line-height:1.55}
.problem .now{color:var(--mute)}
.problem .then{font-family:var(--display);font-weight:600;font-size:clamp(22px,2.4vw,28px);line-height:1.25;color:var(--fg)}
.problem .then mark{background:linear-gradient(transparent 55%,var(--yellow) 55%,var(--yellow) 92%,transparent 92%);color:inherit;padding:0 2px}

/* features */
.features{padding-block:64px 72px}
.features h2{text-align:center;max-width:16em;margin:0 auto 44px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.card{background:var(--tint);border-radius:18px;padding:30px 30px 0;display:flex;flex-direction:column;gap:12px;min-width:0}
.card p{color:var(--mute);font-size:15px;line-height:1.5;max-width:30em}
.card .lot{margin:14px -30px 0;aspect-ratio:16/9;border-radius:0 0 18px 18px;overflow:hidden;background:#F9FAFD}
.card.wide{grid-column:1/-1;flex-direction:row;align-items:center;gap:30px;padding:30px 0 30px 30px}
.card.wide .txt{flex:0 0 300px;display:flex;flex-direction:column;gap:12px}
.card.wide .lot{flex:1;margin:0;border-radius:14px 0 0 14px;min-width:0}

/* steps */
.steps{padding-block:64px}
.steps h2{text-align:center;margin-bottom:40px}
.steprow{display:grid;grid-template-columns:repeat(3,1fr);gap:32px}
.step{min-width:0}
.step .n{font:600 13px var(--display);letter-spacing:.08em;color:var(--mute);text-transform:uppercase;margin-bottom:8px}
.step p{color:var(--mute);font-size:15px;margin-top:6px}

/* trust */
.trust{padding-block:40px;display:flex;justify-content:center;gap:40px;flex-wrap:wrap;font-size:15px}
.trust span{display:flex;align-items:center;gap:10px}
.trust i{width:22px;height:22px;border-radius:5px;background:var(--check);display:inline-grid;place-items:center;flex:none}
.trust i::after{content:"";width:10px;height:5px;border:3px solid #fff;border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}

/* close */
.close{text-align:center;padding-block:72px 80px}
.close .lot{width:min(520px,100%);aspect-ratio:16/9;margin:0 auto 28px}
.close h2{margin-bottom:26px}
.foot{padding-block:28px 40px;font-size:13px;color:var(--mute);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.foot a{text-decoration:none} .foot a:hover{text-decoration:underline}

@media (max-width:760px){
  .problem,.grid,.steprow{grid-template-columns:1fr}
  .card{padding:24px 22px 0} .card .lot{margin:12px -22px 0}
  .card.wide{flex-direction:column;align-items:stretch;padding:24px 22px 0;gap:12px} .card.wide .txt{flex:none} .card.wide .lot{margin:12px -22px 0;border-radius:0 0 18px 18px}
  .nav .brand span{display:none}
  .trust{gap:16px;flex-direction:column;align-items:center}
}
@media (prefers-reduced-motion:reduce){ .lot svg{display:none} .lot{background:var(--tint)} }
