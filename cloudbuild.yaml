steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-f', 'cloud/Dockerfile', '-t', '$_IMAGE', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '$_IMAGE']
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    args:
      - gcloud
      - run
      - deploy
      - svg-to-slides
      - --image=$_IMAGE
      - --region=us-central1
      - --project=$PROJECT_ID
images:
  - '$_IMAGE'
options:
  logging: CLOUD_LOGGING_ONLY
